<script>
// Some static handlers serve /festo without adding the trailing slash,
// which breaks every relative URL in this page. Canonicalize first.
(function(){var p=location.pathname;
if(!/\/$/.test(p)&&!/\.html$/.test(p)){location.replace(p+"/"+location.search+location.hash);}})();
</script>
<title>Fusion Energy Survey — Explore the Data</title>
<link rel="stylesheet" href="./engine.css?v=__BUILD__">
<script>
window.FU_BUILD="__BUILD__";
// Watchdog + diagnostics: if the app never leaves the loading screen,
// report exactly what failed (capture phase sees resource load errors).
window.__fuFailed=[];
window.addEventListener("error",function(e){
  var t=e&&e.target;
  if(t&&(t.src||t.href)){window.__fuFailed.push(t.src||t.href);}
  else{window.__fuErr=(e&&e.message)||String(e);}
},true);
window.addEventListener("unhandledrejection",function(e){
  window.__fuErr="async: "+((e.reason&&e.reason.message)||e.reason);
});
window.addEventListener("load",function(){setTimeout(function(){
  var l=document.querySelector("#app .loading");
  if(!l)return;
  var d=["engine.js executed: "+(window.FU_ENGINE_LOADED?"yes":"NO"),
         "Chart.js: "+(window.Chart?"yes":"NO"),
         "jsPDF: "+(window.jspdf?"yes":"NO")];
  if(window.__fuFailed.length)d.push("failed to load: "+window.__fuFailed.join(", "));
  if(window.__fuErr)d.push("error: "+window.__fuErr);
  l.style.whiteSpace="pre-wrap";l.style.textAlign="left";
  l.textContent="The dashboard failed to start.\n\nDiagnostics (please send this to the maintainers):\n"+
    d.join("\n")+"\nbuild "+window.FU_BUILD+" — "+navigator.userAgent;
  fetch("config.json?v="+window.FU_BUILD).then(function(r){
    l.textContent+="\nconfig.json fetch: HTTP "+r.status;
  },function(err){l.textContent+="\nconfig.json fetch FAILED: "+err;});
},3000);});
</script>

<body>
<!-- ─────────────────────────────────────────────────────────────────────────
     The IPPRA institutional bar. Shared chrome for EVERY dashboard, not a
     FESTO-specific thing: it is static markup here (not built from config)
     so it paints with the page instead of waiting on engine.js, and so it
     reads the same on every dashboard that reuses this shell.

     It has two jobs, chosen by how the visitor arrived:
       • direct    — names the institute and links to ippra.net, which is the
                     whole point: a dashboard on its own gives no clue who
                     made it.
       • referred  — someone clicked through from ippra.net. These links open
                     in a NEW TAB, so that person has no back button at all;
                     the bar becomes their way back to the page they left.

     Black with white text (21:1). Crimson is the rule beneath, NOT the text:
     OU crimson on black measures 2.11:1 and fails WCAG AA outright.
     ───────────────────────────────────────────────────────────────────── -->
<div id="ippra-bar">
  <a class="ippra-bar-home" href="https://ippra.net">IPPRA &middot; University of Oklahoma</a>
  <a class="ippra-bar-back" href="https://ippra.net"><span aria-hidden="true">&larr;</span> Back to IPPRA</a>
</div>
<script>
// Runs immediately after the bar so the mode is settled before paint — doing
// this from engine.js (loaded at the end of body) would flash the wrong one.
(function () {
  var root = document.documentElement;
  // Only ever return to a path on THIS origin. A caller-supplied destination
  // that could be absolute would make this an open redirect, which on a
  // university domain is a phishing gift.
  function safePath(p) {
    return (typeof p === "string" && p.charAt(0) === "/" &&
            p.charAt(1) !== "/" && p.charAt(1) !== "\\") ? p : null;
  }
  var back = null;
  try {
    // 1. explicit ?from= on the link — deterministic, and survives the
    //    trailing-slash canonicalizer above because it keeps location.search.
    var from = new URLSearchParams(location.search).get("from");
    back = safePath(from);
    // 2. otherwise trust a same-origin referrer, so links added elsewhere on
    //    the site work without anyone remembering to add the parameter.
    if (!back && document.referrer) {
      var r = new URL(document.referrer);
      if (r.origin === location.origin &&
          r.pathname.replace(/\/+$/, "") !== location.pathname.replace(/\/+$/, "")) {
        back = r.pathname + r.search;
      }
    }
  } catch (e) { /* malformed referrer or no URL support: fall through */ }

  if (back) {
    root.setAttribute("data-entry", "referred");
    var backLink = document.querySelector(".ippra-bar-back");
    backLink.setAttribute("href", back);

    // Going "back" from a tab that was opened with target="_blank" is not a
    // navigation problem, it is a tab problem: the page they came from is
    // still open in the tab behind this one. Navigating there would just give
    // them the same page twice, and history.back() does nothing because a
    // fresh tab has nothing behind it.
    //
    // A tab IS closable here: the HTML spec makes a top-level browsing context
    // script-closable while its session history holds a single Document, which
    // is exactly the state of an untouched target="_blank" tab. Closing it
    // drops the reader back on the tab they left — the real "back".
    //
    // That stops being true the moment they use the dashboard: it routes on
    // hashchange, and every page they visit adds a history entry. So check at
    // click time, not at load, and keep the href as the honest fallback.
    backLink.addEventListener("click", function (ev) {
      // Leave modified clicks alone — ctrl/cmd/shift/middle still mean "open
      // this somewhere else", and hijacking them is always wrong.
      if (ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
      ev.preventDefault();
      var href = backLink.getAttribute("href");
      // Try to close unconditionally rather than predicting whether we may.
      // An earlier version gated on history.length === 1, but that is a guess
      // about session history this code cannot check reliably, and guessing
      // wrong leaves a link that does nothing. close() is simply refused when
      // it is not allowed, which the fallback below handles.
      window.close();
      // close() fails SILENTLY when refused — no exception, no return value.
      // So if this timer still runs, we were not allowed to close, and the
      // honest behaviour is to go to the page rather than appear broken.
      setTimeout(function () { location.href = href; }, 150);
    });
    // Wipe ?from= from the address bar so a copied or shared link is clean
    // and shows the institutional bar rather than someone else's back button.
    if (window.history && history.replaceState && /[?&]from=/.test(location.search)) {
      var q = new URLSearchParams(location.search);
      q.delete("from");
      var qs = q.toString();
      history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
    }
  }
})();
</script>
