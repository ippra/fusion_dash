# Builds the fusion dashboard and publishes it to GitHub Pages as the beta.
# The survey files and reference tables are committed, so the whole pipeline
# (02-06) runs here from a clean checkout, about three minutes; outputs/ is not
# committed and never needs to be.
#
# The production site at ippra.net/festo is not deployed from here. It is built
# without the channel variable and copied to our own server; see README.md,
# "Deploying".
name: Deploy beta

on:
  push:
    branches: [master]
    paths:
      - "0*.R"
      - "01_variable_reference/**"
      - "data/**"
      - "site/**"
      - ".github/workflows/deploy-beta.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still building.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Binary packages from Posit's package manager, cached between runs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::srvyr
            any::survey
            any::jsonlite
            any::here

      - name: Compute the dashboard data
        run: |
          Rscript 02_create_question_data.R
          Rscript 03_create_open_response_data.R
          Rscript 04_create_sme_data.R
          Rscript 05_create_sme_open_response_data.R

      - name: Build the site
        env:
          FUSION_CHANNEL: beta
        run: Rscript 06_build_dashboard.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/06_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
